name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: prism
          POSTGRES_USER: prism
          POSTGRES_PASSWORD: prism
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prism -d prism"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install .[dev]
      - run: ruff check app tests
      - run: mypy app
      - run: alembic upgrade head
        env:
          PRISM_ALEMBIC_DATABASE_URL: postgresql+psycopg://prism:prism@localhost:5432/prism
      - run: pytest
      - run: pytest -q tests/integration
        env:
          PRISM_INTEGRATION: '1'
          PRISM_DATABASE_URL: postgresql+asyncpg://prism:prism@localhost:5432/prism
          PRISM_REDIS_URL: redis://localhost:6379/0
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package.json}
      - run: npm install
      - run: npm run build
